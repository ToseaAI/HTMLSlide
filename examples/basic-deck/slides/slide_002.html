<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portable Assets</title>
    <link rel="stylesheet" href="../assets/brand.css" />
    <style>
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
        margin-top: 48px;
      }

      .asset-preview {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .card {
        min-height: 250px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f9fbff;
      }

      .card strong {
        display: block;
        font-size: 32px;
        margin-bottom: 12px;
      }

      .card span {
        color: var(--muted);
        font-size: 21px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main class="htmlslice-slide">
      <div class="kicker">Separate pages</div>
      <h1 class="title">The presenter controls the deck outside the slide.</h1>
      <section class="grid">
        <img class="asset-preview" src="../assets/chart.svg" alt="Local chart asset" />
        <div class="card">
          <strong>01</strong>
          <span>Manifest defines playback order. Relative paths keep images portable inside the zip.</span>
        </div>
      </section>
    </main>
  </body>
</html>
